<!DOCTYPE html>
<html lang="es">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <h1 class="titulo">Titulo Provisional</h1>
    </header>
    <div class="botones">
        <p class="textoAcceso">Bienvenido! Click <strong>aquí</strong> para acceder a la página!</p>
        <button class="botonAcceso"><i class="fa-solid fa-user"></i>Acceso a la página!</button>
    </div>
    <script>
        const botonAcceso = document.querySelector('.botonAcceso');
        botonAcceso.addEventListener('click', () => {
            window.location.href = 'main.html';
        })
    </script>
</body>
</html>
