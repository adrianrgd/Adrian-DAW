<!DOCTYPE html>
<html lang="es">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <h1 class="titulo">Titulo Provisional</h1>
        <div class="nav">
            <ul>
                <input class="buscador" type="text" placeholder="Buscar">
                <button class="botonBuscar"><i class="fa-solid fa-magnifying-glass"></i></button>
            </ul>
            <select name="modoPagina" id="selectModo">
                <option value="1" selected>Modo Oscuro</option>
                <option value="2">Modo Claro</option>
                <option value="3">Personalizado</option>
            </select>
            <div class="AñadirTarjeta">
                <button class="btnAñadirTarjeta"><i class="fa-solid fa-plus"></i>Añadir Tarjeta</button>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="contenedor">
            <div class="tarjeta">
                <section class="seccionImagen">
                    <img id="imagenTarjeta" src="img/Captura de pantalla 2026-02-13 102300.png" alt="Imagen provisional">
                </section>
                <section class="seccionContenido">
                    <h2 id="tituloTarjeta">Titulo Provisional</h2>
                    <hr class="linea">
                    <p id="textoTarjeta">Texto Provisional de prueba para una descripción más larga de la tarjeta</p>
                </section>
            </div>
        </div>
    </main>
    <script src="scripts/main.js"></script>
</body>
</html>
