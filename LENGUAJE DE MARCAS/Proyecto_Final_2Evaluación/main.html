<!DOCTYPE html>
<html lang="es">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">    
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>PROYECTO LENGUAJE DE MARCAS</title>
</head>
<body class="grid-container">
    <header class="header">
        <h1 class="titulo">MI GALERÍA</h1>
        <div class="nav">
            <div class="busqueda-group">
                <input class="buscador" type="text" id="inputBusqueda" placeholder="Buscar título...">
                <button class="botonBuscar" id="btnBuscar"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            
            <select id="selectModo" class="selector-tema">
                <option value="oscuro">Modo Oscuro</option>
                <option value="claro">Modo Claro</option>
                <option value="personalizado">Personalizado</option>
            </select>

            <button class="btnAñadirTarjeta" id="btnAbrirModal">
                <i class="fa-solid fa-plus"></i> Añadir Tarjeta
            </button>
        </div>
    </header>

    <main class="main">
        <div class="contenedor" id="contenedorTarjetas">
            </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 - Proyecto Final Lenguaje de Marcas - Mi Galería</p>
    </footer>

    <div id="modalAlta" class="modal">
        <div class="ventana modal-contenido">
            <div class="barra-titulo">
                <div class="texto-titulo">NUEVA_ENTRADA.SYS</div>
                <button class="bt-cerrar">×</button>
            </div>
            <form id="formNuevaTarjeta" class="cuerpo-ventana">
                <input type="text" id="nuevoNombre" placeholder="Nombre del lugar" required>
                <textarea id="nuevoTexto" placeholder="Descripción..." required></textarea>
                <input type="file" id="nuevaImagen" accept="image/*" required>
                <button type="submit" class="boton-enlace">GUARDAR EN XML</button>
            </form>
        </div>
    </div>
</body>
